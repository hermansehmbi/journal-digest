name: EP Digest

# ─────────────────────────────────────────────────────────────────────────────
# CRON IS DISABLED until you finish testing (see README "Cutover plan").
# Re-enable by un-commenting the schedule block below.
# Electrophysiology launches without TTS audio / Deep Dive / GitHub Pages — the
# Monday email is article links + embedded podcast links; Saturday is CME.
# ─────────────────────────────────────────────────────────────────────────────
on:
  # schedule:
  #   # Monday 11:00 UTC (7:00 AM ET summer) — weekly digest
  #   - cron: '0 11 * * 1'
  #   # Saturday 12:00 UTC (8:00 AM ET) — weekly CME
  #   - cron: '0 12 * * 6'

  workflow_dispatch:
    inputs:
      command:
        description: 'Which email to send'
        required: true
        default: 'digest'
        type: choice
        options: [digest, saturday, preview, preview-sat]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # EP does not publish to GitHub Pages, so read-only is enough.
    permissions:
      contents: read

    env:
      SPECIALTY: ep
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      SENDER_EMAIL: ${{ secrets.GMAIL_ADDRESS }}
      # Live MOC tracking in Google Sheets (optional — falls back to local xlsx).
      # The key may be named GOOGLE_SHEETS_CREDENTIALS or GOOGLE_SERVICE_ACCOUNT_JSON.
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore article cache
        uses: actions/cache/restore@v4
        with:
          path: |
            articles_cache_ep.json
            monday_featured_ep.json
            fulltext_cache_ep.json
            weekly_summaries_ep.json
            summaries_cache_ep.json
          key: cache-ep-${{ github.run_id }}
          restore-keys: cache-ep-

      - name: Restore MOC tracker
        uses: actions/cache/restore@v4
        with:
          path: self_assessment_tracker_ep.xlsx
          key: moc-ep-${{ github.run_id }}
          restore-keys: moc-ep-

      - name: Determine command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "command=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            DAY=$(date -u +%u)
            if [ "$DAY" = "6" ]; then
              echo "command=saturday" >> $GITHUB_OUTPUT
            else
              echo "command=digest" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run
        run: python main.py ${{ steps.cmd.outputs.command }} --specialty=ep

      - name: Save article cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            articles_cache_ep.json
            monday_featured_ep.json
            fulltext_cache_ep.json
            weekly_summaries_ep.json
            summaries_cache_ep.json
          key: cache-ep-${{ github.run_id }}

      - name: Save MOC tracker
        if: always()
        uses: actions/cache/save@v4
        with:
          path: self_assessment_tracker_ep.xlsx
          key: moc-ep-${{ github.run_id }}
